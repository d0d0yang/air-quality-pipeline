<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Quality Pipeline · Forecast</title>
  <meta name="description" content="How the next-day PM2.5 forecast did on a held-out year.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="forecast">
<div class="sheet">
  <header class="masthead">
    <h1>How good is the forecast</h1>
    <p class="masthead__sub">Next-day PM2.5, scored once on a held-out year. <span id="refreshed"></span></p>
    <nav class="nav"><a href="index.html">Map</a><a href="forecast.html" aria-current="page">Forecast</a><a href="pipeline.html">Pipeline</a></nav>
  </header>
  <main>
    <section class="panel">
      <h2>Holdout year, all monitors</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Forecast</th><th class="num">MAE (µg/m³)</th><th class="num">RMSE</th><th class="num">Skill vs persistence</th><th class="num">MAE, worst 10% of days</th></tr></thead>
        <tbody id="metrics"></tbody>
      </table></div>
      <ul class="note" id="findings"></ul>
      <p class="note">Details and weak spots: <a href="https://github.com/d0d0yang/air-quality-pipeline/blob/main/docs/model-card.md">model card</a>.</p>
    </section>
    <section class="panel">
      <div class="toolbar">
        <h2>Predicted vs actual</h2>
        <label>Station <select id="site"></select></label>
      </div>
      <div class="chart"><canvas id="holdout-chart" role="img" aria-label="Daily mean PM2.5, actual and forecast, over the holdout year"></canvas></div>
    </section>
  </main>
  <footer class="footer"></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
