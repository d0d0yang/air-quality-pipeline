[project]
name = "air-quality-pipeline"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["function_app/pipeline", "function_app/model", "function_app/.python_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local sql server container (docker compose up -d)"]
addopts = "-m 'not db'"
